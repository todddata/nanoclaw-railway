name: Security verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install host dependencies
        run: npm ci
      - name: Typecheck host
        run: npm run typecheck
      - name: Test host
        run: npm test
      - name: Build host
        run: npm run build
      - name: Audit host production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install and test agent runner
        working-directory: container/agent-runner
        run: npm ci && npm test && npm audit --omit=dev --audit-level=high

      - name: Audit Slack-only Railway runtime
        working-directory: railway-runtime
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
