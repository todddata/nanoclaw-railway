name: Security verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the pull-request commit range, including the parent.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install host dependencies
        run: npm ci
      - name: Typecheck host
        run: npm run typecheck
      - name: Test host
        run: npm test
      - name: Build host
        run: npm run build
      - name: Audit host production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install and test agent runner
        working-directory: container/agent-runner
        run: npm ci && npm test && npm audit --omit=dev --audit-level=high

      - name: Audit Slack-only Railway runtime
        working-directory: railway-runtime
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high

      - name: Install, test, and audit mail broker
        working-directory: mail-broker
        run: npm ci && npm run typecheck && npm test && npm audit --omit=dev --audit-level=high

      - name: Build production container image
        run: docker build --tag nanoclaw:${{ github.sha }} .

      - name: Scan production container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: nanoclaw:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
